name: Build and Push Excalidraw
on:
  push:
    branches:
      - main  # Hangi dala push yapınca çalışsın?

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # İmaj adı: ghcr.io/kullanici_adin/telos-whiteboard:latest
          tags: ghcr.io/${{ github.repository_owner }}/telos-whiteboard:latest
          # Coolify'daki Build Argument buraya geliyor:
          build-args: |
            VITE_APP_WS_SERVER_URL=https://collab-draw.coolhost.site
          cache-from: type=gha
          cache-to: type=gha,mode=max