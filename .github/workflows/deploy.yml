name: Build and Push Excalidraw
on:
  push:
    branches:
      - main  # Burası 'master' ise master yapmayı unutma!

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BU ADIM ÇOK KRİTİK: Kullanıcı adını küçük harfe çevirir
      - name: Lowercase repo owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Burada artık OWNER_LC (küçük harf olan) değişkenini kullanıyoruz
          tags: ghcr.io/${{ env.OWNER_LC }}/telos-whiteboard:latest
          build-args: |
            VITE_APP_WS_SERVER_URL=wss://collab-draw.coolhost.site